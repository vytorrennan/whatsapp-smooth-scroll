<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Smooth Scroll</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <img src="icons/48.png" width="32" height="32" alt="">
    <div><h1>WhatsApp Smooth Scroll</h1><p>Smoother message history</p></div>
  </header>
  <label class="setting" for="enabled">
    <span>Enable smooth scrolling</span>
    <input id="enabled" type="checkbox" role="switch" disabled aria-describedby="help">
  </label>
  <p id="help">Applies to WhatsApp Web. You can keep hardware acceleration on.</p>
  <p id="status" role="status" aria-live="polite">Loading…</p>
</body>
</html>
